name="GM Core"
description="GM Core is a framework built on traditional tabletop-RPG principles. It attempts to merge modern software design patterns with classic pen-and-paper concepts, such as the role of the Game Master and the action adjudication loop, to provide an extensible base for building RPGs and roguelikes."
author="Luca Carbone"
version="0.1"
script="gm_core.gd"
